<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
  <title>更新提醒</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: #14161a;
      color: #e8eaed;
      overflow: hidden;
      border: 1px solid rgba(53, 196, 181, 0.35);
      border-radius: 10px;
    }
    .toast-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; height: 100%; }
    .toast-head { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
    .t-avatar { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; flex: none; }
    .t-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
    .t-name { font-size: 13px; font-weight: 600; }
    .t-badge { font-size: 11px; color: #35c4b5; background: rgba(53, 196, 181, 0.12); border-radius: 6px; padding: 1px 7px; margin-left: auto; }
    .t-close {
      flex: none; border: 0; background: transparent; color: rgba(255, 255, 255, 0.45);
      font-size: 15px; line-height: 1; cursor: pointer; padding: 2px 4px; border-radius: 5px;
    }
    .t-close:hover { color: #fff; background: rgba(255, 255, 255, 0.1); }
    .t-item {
      display: flex; gap: 10px; padding: 7px 8px;
      border-radius: 8px; background: rgba(255, 255, 255, 0.03);
      cursor: pointer; min-width: 0;
    }
    .t-item:hover { background: rgba(53, 196, 181, 0.1); }
    .t-cover { width: 84px; height: 52px; border-radius: 5px; object-fit: cover; flex: none; background: #22262e; }
    .t-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .t-title {
      font-size: 12px; line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .t-meta { display: flex; gap: 8px; font-size: 11px; opacity: 0.5; margin-top: auto; }
    .t-kind { color: #35c4b5; opacity: 1; }
    .t-kind.live { color: #ff6b6b; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./toast.jsx"></script>
</body>
</html>
